und-size:48px 35px;transform:skewY(-1deg)}.path{position:absolute;left:905px;top:349px;width:48px;height:105px;background:#81d5b04d;border:2px solid #a0e1c2}.range{position:absolute;left:763px;top:313px;width:144px;height:105px;background:#d68e673a;clip-path:polygon(33% 0,66% 0,66% 33%,100% 33%,100% 66%,66% 66%,66% 100%,33% 100%,33% 66%,0 66%,0 33%,33% 33%);filter:drop-shadow(0 0 2px #ffd19d)}.detail{left:28px;top:136px;width:300px}.detail p{font-size:15px;line-height:1.7;color:#d1d9cc;margin:12px 0}.detail h3{font-size:22px;font-weight:500;margin:3px 0 12px}.dim{position:absolute;inset:0;background:#07141b99;backdrop-filter:blur(2px)}.modal{left:50%;top:50%;transform:translate(-50%,-50%);width:530px;padding:26px}.modal h3{font-weight:500;font-size:26px;margin:4px 0 20px;color:#e6d09c}.modal p{font-size:18px;line-height:1.8;margin:14px 0}.actions{display:flex;gap:12px;margin-top:24px}.actions span{flex:1;text-align:center;padding:12px;border:1px solid #7d908c;font-size:17px}.actions .selected{background:#c8bd94;color:#172831;text-shadow:none}.list{left:50%;top:50%;transform:translate(-50%,-50%);width:650px;padding:22px}.list h3{font-size:24px;font-weight:500;margin:3px 0 18px;color:#e6d09c}.list .row{font-size:19px;padding:13px}.list .description{border-top:1px solid #84958b;margin-top:18px;padding-top:15px;font-size:16px;line-height:1.8;color:#c7d6cc}.banner{position:absolute;top:205px;left:0;right:0;text-align:center;background:linear-gradient(90deg,transparent,#102a35e8 25%,#102a35e8 75%,transparent);padding:28px}.banner h3{font-family:Georgia,serif;letter-spacing:9px;font-size:45px;font-weight:400;color:#e3d3a7;margin:0 0 12px}.banner p{margin:0;font-size:21px}.dialog{left:28px;right:28px;bottom:27px;min-height:156px;padding:22px 30px 22px 188px}.portrait{position:absolute;left:27px;bottom:16px;width:135px;height:168px;background-image:url('assets/leon-portrait.png');background-size:922px auto;background-position:-333px -366px;border-bottom:1px solid #b4baa6}.dialog .name{color:#e8d39e;margin-bottom:12px;font-size:20px}.dialog p{font-size:23px;line-height:1.8;margin:0}.dialog .next{position:absolute;right:23px;bottom:15px;color:#d1c59c;font-size:15px}.float{position:absolute;left:770px;top:275px;font-size:44px;font-weight:500;color:#ffe2c0;-webkit-text-stroke:1px #503529}.notice{position:absolute;left:50%;top:125px;transform:translateX(-50%);background:#142831ed;border:1px solid #dcab81;padding:12px 24px;font-size:18px;white-space:nowrap}.party{left:28px;bottom:180px;width:286px}.tilelegend{position:absolute;left:713px;top:497px;font-size:15px;background:#182b32ed;padding:7px 12px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.summary-grid div{border-top:1px solid #627674;padding-top:12px;font-size:17px}.summary-grid b{display:block;font-size:27px;font-weight:400;color:#e7d8b0;margin-top:8px}.wide-list{width:710px}.key{font-family:inherit;border:1px solid #8a9e96;padding:3px 10px;min-width:80px;text-align:center;color:#d9dfd0}.progresslabel{font-size:14px;color:#c4d5c8;display:flex;justify-content:space-between;margin-top:12px}.badge{font-size:13px;color:#edbd85;border:1px solid #ae8b6b;padding:3px 7px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}.gallery article{min-width:0}.gallery .caption h2{font-size:16px}.gallery .caption p{font-size:12px}.gallery .tag{display:none}.gallery article{cursor:zoom-in}footer{border-top:1px solid #343b3c;padding:20px 32px;color:#99aaa8;font-size:13px;line-height:1.8}.hidden{display:none!important}@media(max-width:760px){header{padding:18px;display:block}nav{padding:14px 18px}main{padding:0 12px 24px}.gallery{grid-template-columns:1fr}.caption{align-items:flex-start}#count{margin-left:0}header .muted{margin-top:10px}}@media print{body{background:#fff;color:#111}header,nav,footer,#single{display:none!important}#gallery{display:block!important}article{break-after:page;padding-top:12px}.frame{border:0}.caption p{color:#333}.scene{print-color-adjust:exact;-webkit-print-color-adjust:exact}@page{size:A4 landscape;margin:10mm}}
</style></head><body>
<header><div><small>SPRINGBOUND FRONTIER · UI STUDY 01</small><h1>전투 화면 전체 목업</h1></div><div class="muted">그로우랜서 1편 PC판 참고 · 1280 × 720 · 30개 상태</div></header>
<nav><button id="prev" aria-label="이전 화면">←</button><select id="picker" aria-label="목업 화면 선택"></select><button id="next" aria-label="다음 화면">→</button><button id="one" class="active">한 장씩</button><button id="all">전체 보기</button><button id="print">인쇄 / PDF</button><span id="count"></span></nav>
<main><div id="single"></div><div id="gallery" class="gallery hidden"></div></main>
<footer>현재 게임의 필드와 자체 캐릭터를 사용한 UI 디자인 시안입니다. 마법·동료·상태 이상·후퇴 화면은 확장 기능을 위한 설계이며, 구현 완료를 뜻하지 않습니다. 키 표시는 임시 조작안이고 원작 PC판 키표의 검증 결과가 아닙니다. 수치·보상·기술명은 목업용 예시입니다.<br>참고: <a style="color:#c8c5a8" href="https://game.watch.impress.co.jp/docs/20010406/digicube.htm">2001 PC판 소개</a> · <a style="color:#c8c5a8" href="https://game.watch.impress.co.jp/docs/20010406/grow16.htm">PC판 전투 화면</a></footer>
<script>
const screens=[
['전투 진입','목표와 패배 조건을 짧게 알리는 시작 화면','기본','intro'],
['전투 진행','명령창을 접고 필드와 아군 상태를 우선 표시','기본','live'],
['명령 정지','시간이 멈췄음을 표시하고 세로 명령창 열기','기본','command'],
['이동 칸 선택','현재 위치·경로·도착 칸을 구분','기본','move'],
['이동 불가','지형이나 점유로 선택할 수 없는 칸 안내','예외','blocked'],
['공격 대상 선택','대상 정보와 인접 공격 가능 칸 표시','기본','attack'],
['접근 후 공격','사거리 밖 대상에게 접근하는 명령을 확인','기본','approach'],
['공격 준비와 적중','준비 게이지·피해 숫자를 필드에 표시','기본','hit'],
['적의 공격 예고','공격 준비와 위험 칸을 분명하게 표시','기본','warning'],
['회피와 빗나감','위협이 끝난 결과를 작은 필드 피드백으로 표시','기본','miss'],
['아이템 목록','수량·사용 불가 상태·효과를 같은 창에 표시','기본','items'],
['아이템 대상 선택','회복 대상과 회복 후 예상 체력 표시','기본','itemtarget'],
['아이템 사용 예약','재개 전 사용 예약과 취소 가능 상태','기본','itemqueue'],
['기술·마법 목록','소모 마나·시전 시간·사용 가능 상태 비교','확장','spells'],
['마법 범위 선택','대상 칸·범위·영향받는 유닛 표시','확장','aoe'],
['시전 진행과 취소','시전 중 진행과 취소 확인을 분리','확장','casting'],
['동료 선택과 명령','아군 목록에서 선택한 인물의 명령을 구분','확장','party'],
['캐릭터 상세','능력치·현재 명령·상태를 확인하는 화면','확장','character'],
['적 정보','알려진 적의 사거리·현재 행동을 확인','확장','inspect'],
['상태 이상','남은 시간과 효과를 색상 외 텍스트로도 전달','확장','ailment'],
['전투 중 대화','캐릭터와 필드를 보존하는 하단 대화창','기본','dialog'],
['조작 안내','한 번에 한 동작을 설명하는 첫 전투 안내','기본','tutorial'],
['전투 일시정지','명령 정지와 별개인 시스템 메뉴','기본','pause'],
['승리 결과','승리와 다음 행동을 간결하게 안내','기본','victory'],
['패배','패배 원인과 다시 할 수 있는 선택 표시','기본','defeat'],
['재도전 확인','복구되는 상태와 남은 소모품을 구분','기본','retry'],
['전투 표시 설정','격자·경로·사거리·피해 표시 옵션 디자인','설정안','settings'],
['키 설정','현재 매핑·변경 선택·기본값 복원 화면','설정안','keys'],
['후퇴 확인','불가능한 전투에서는 이유와 함께 비활성화','확장','retreat'],
['시작 화면으로','전투 직전 기록으로 돌아가는 종료 확인','기본','exit']
];
const win=(cls,body)=>`<div class="win ${cls}">${body}</div>`;
const row=(name,value='',selected=false,off=false)=>`<div class="row ${selected?'sel':''} ${off?'off':''}"><span>${selected?'▸ ':''}${name}</span><small>${value}</small></div>`;
const choices=(a,b)=>`<div class="actions"><span class="selected">${a}</span><span>${b}</span></div>`;
const modal=(title,text,a='확인',b='취소')=>`<div class="dim"></div>${win('modal',`<div class="cap">SPRINGBOUND FRONTIER</div><h3>${title}</h3><p>${text}</p>${choices(a,b)}`)}`;
function hero(hp=36,action='대기 중',extra=''){return win('hero',`<div class="cap">PLAYER · 01</div><div class="who"><span>에일</span><span class="gold">Lv. 1</span></div><div class="values"><span>HP</span><span>${hp} / 48</span></div><div class="bar"><i style="width:${hp/48*100}%"></i></div><div class="values"><span>MP  12 / 18</span><span>${extra}</span></div><div class="recovery">${action}</div>`)}
function target(){return win('target',`<div class="cap">TARGET · 적</div><div>가시털 들쥐 <span style="float:right" class="badge">근접</span></div><div class="bar red"><i style="width:71%"></i></div><div class="values"><span>HP 60 / 84</span><span>거리 3칸</span></div>`)}
function commands(selected='이동'){return win('command',`<div class="cap">COMMAND · 에일</div>${['공격','이동','기술·마법','아이템','대기'].map(x=>row(x,'',x===selected)).join('')}<div class="recovery">명령 선택 후 시간 재개</div>`)}
function base(kind){const quiet=['intro','victory','defeat','retry','pause','settings','keys','exit'].includes(kind);let h=`<div class="objective"><b>고요한 산길</b><br>레온을 지켜라</div><div class="actor-mark"></div>`;if(!quiet&&kind!=='dialog')h+=hero(['itemtarget','itemqueue'].includes(kind)?18:36,kind==='live'?'가시털 들쥐에게 접근 중':'명령 대기');if(!quiet&&!['dialog','tutorial'].includes(kind))h+=target();if(!['live','intro','victory','defeat','dialog','hit','miss','warning','casting'].includes(kind))h+='<div class="state">Ⅱ 명령 정지</div>';if(['live','hit','warning','miss','casting'].includes(kind))h+='<div class="state">▶ 시간 진행</div>';return h}
function content(k){switch(k){
case'intro':return `<div class="dim"></div><div class="banner"><h3>ENCOUNTER</h3><p>고요한 산길 · 레온을 지켜라</p></div>${win('modal',`<div class="cap">BATTLE OBJECTIVE</div><h3>가시털 들쥐를 쓰러뜨려라</h3><p>승리 조건　가시털 들쥐 격파<br>패배 조건　에일의 전투 불능</p>${choices('전투 시작','조작 안내')}`).replace('class="win modal"','class="win modal" style="top:510px;width:610px"')}`;
case'live':return `<div class="field-label" style="left:870px;top:272px">에일</div><div class="hint">시간 진행 중　<kbd>Space</kbd> 명령 정지</div>`;
case'command':return commands('공격')+`<div class="hint">명령을 선택하세요　<kbd>↑ ↓</kbd> 선택 <kbd>Enter</kbd> 확인</div>`;
case'move':return commands('이동')+`<div class="grid"></div><div class="path"></div><div class="cursor" style="left:905px;top:419px"></div><div class="tilelegend">이동 경로 3칸　·　도착 후 대기</div><div class="hint">이동할 칸 선택　<kbd>방향키</kbd> 이동 <kbd>Enter</kbd> 확정</div>`;
case'blocked':return commands('이동')+`<div class="grid"></div><div class="cursor" style="left:1001px;top:384px;border-color:#dc8f7e;background:#d3796b44"></div><div class="notice">× 나무가 가로막고 있어 이동할 수 없습니다</div><div class="hint">다른 칸을 선택하세요　<kbd>Esc</kbd> 취소</div>`;
case'attack':return commands('공격')+`<div class="range"></div><div class="actor-mark enemy-mark"></div><div class="field-label" style="left:711px;top:264px">▾ 가시털 들쥐</div><div class="hint">인접한 상하좌우 1칸에서 공격　<kbd>Enter</kbd> 확정</div>`;
case'approach':return commands('공격')+`<div class="path" style="left:809px;top:349px;width:96px;height:35px"></div><div class="range"></div>${win('detail','<div class="cap">ATTACK ORDER</div><h3>접근 후 공격</h3><p>검이 닿는 칸까지 이동한 뒤<br>같은 대상을 계속 공격합니다.</p><div class="values"><span>공격 사거리</span><span>1칸</span></div>')}<div class="hint">선택한 명령: 가시털 들쥐 공격　<kbd>Space</kbd> 재개</div>`;
case'hit':return `<div class="actor-mark enemy-mark"></div><div class="float">6</div><div class="field-label" style="left:835px;top:252px">에일 · 검 공격</div>${win('detail','<div class="cap">ACTION</div><div>에일의 공격!</div><div class="progresslabel"><span>행동 후 대기</span><span>1.2초</span></div><div class="bar"><i style="width:35%"></i></div>')}<div class="hint">가시털 들쥐에게 6 피해</div>`;
case'warning':return `<div class="range" style="background:#ee8c7666"></div><div class="field-label" style="left:725px;top:272px;border-color:#dda388">! 물기 준비</div>${win('detail','<div class="cap">ENEMY ACTION</div><h3>가시털 들쥐 · 물기</h3><div class="progresslabel"><span>공격 준비</span><span>0.6초</span></div><div class="bar red"><i style="width:65%"></i></div>')}<div class="hint">위험 칸에서 벗어나면 물기를 피할 수 있습니다</div>`;
case'miss':return `<div class="float" style="font-size:29px;color:#c2dfdc">빗나감</div><div class="hint">가시털 들쥐의 물기를 피했다</div>`;

function article(s,i){return `<article data-index="${i}"><div class="caption"><div><h2>${String(i+1).padStart(2,'0')} · ${s[0]}</h2><p>${s[1]}</p></div><span class="tag">${s[2]}</span></div><div class="frame"><div class="scene" role="img" aria-label="${s[0]} 전투 UI 목업">${base(s[3])}${content(s[3])}</div></div></article>`}
const picker=document.getElementById('picker'),single=document.getElementById('single'),gallery=document.getElementById('gallery');let current=0;
picker.innerHTML=screens.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${s[0]}</option>`).join('');gallery.innerHTML=screens.map(article).join('');
function scale(){document.querySelectorAll('.frame').forEach(f=>{if(f.clientWidth)f.firstElementChild.style.transform=`scale(${f.clientWidth/1280})`})}const observer=new ResizeObserver(scale);observer.observe(document.querySelector('main'));
function show(i){current=(i+screens.length)%screens.length;single.innerHTML=article(screens[current],current);picker.value=current;document.getElementById('count').textContent=`${current+1} / ${screens.length}`;scale()}
function mode(all){gallery.classList.toggle('hidden',!all);single.classList.toggle('hidden',all);document.getElementById('all').classList.toggle('active',all);document.getElementById('one').classList.toggle('active',!all);scale()}
picker.onchange=()=>{mode(false);show(Number(picker.value))};document.getElementById('prev').onclick=()=>{mode(false);show(current-1)};document.getElementById('next').onclick=()=>{mode(false);show(current+1)};document.getElementById('one').onclick=()=>mode(false);document.getElementById('all').onclick=()=>mode(true);document.getElementById('print').onclick=()=>{mode(true);window.print()};gallery.onclick=e=>{const a=e.target.closest('article');if(a){mode(false);show(Number(a.dataset.index));window.scrollTo({top:0,behavior:'smooth'})}};window.addEventListener('beforeprint',()=>{mode(true);scale()});const params=new URLSearchParams(location.search);show(Math.min(29,Math.max(0,Number(params.get('screen')||0))));if(params.get('view')==='all')mode(true);
</script></body></html>
